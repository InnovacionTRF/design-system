<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">


<link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;font-family:var(--trf-font-sans);color:var(--trf-text);background:var(--trf-surface);padding:20px}
.row{display:flex;gap:10px}.sw{flex:1}.b{height:46px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.n{margin:6px 0 0;font-family:var(--trf-font-mono);font-size:10px;color:var(--trf-text-muted)}</style></head>
<body>
<div class="row">
<div class="sw"><div class="b" style="background:var(--trf-series-1)"></div><p class="n">series-1</p></div>
<div class="sw"><div class="b" style="background:var(--trf-series-2)"></div><p class="n">series-2</p></div>
<div class="sw"><div class="b" style="background:var(--trf-series-3)"></div><p class="n">series-3</p></div>
<div class="sw"><div class="b" style="background:var(--trf-series-4)"></div><p class="n">series-4</p></div>
<div class="sw"><div class="b" style="background:var(--trf-series-5)"></div><p class="n">series-5</p></div>
<div class="sw"><div class="b" style="background:var(--trf-series-6)"></div><p class="n">series-6</p></div>
<div class="sw"><div class="b" style="background:var(--trf-series-7)"></div><p class="n">series-7</p></div>
<div class="sw"><div class="b" style="background:var(--trf-series-8)"></div><p class="n">series-8</p></div>
</div>
<p style="margin:14px 0 0;font-size:12px;color:var(--trf-text-secondary)">Asigne los colores en este orden. Si una serie es «la importante», va en <strong>series-1</strong>; nunca reparta el naranja entre varias.</p>
</body></html>

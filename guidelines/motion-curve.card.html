<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">


<link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;font-family:var(--trf-font-sans);color:var(--trf-text);background:var(--trf-surface);padding:20px}.mono{font-family:var(--trf-font-mono)}.dot{width:16px;height:16px;border-radius:50%;background:#fc7603}.track{position:relative;height:16px;background:var(--trf-orange-50);border-radius:8px;overflow:hidden}.dot{position:absolute;top:0;left:0;animation:run 2.4s var(--trf-ease) infinite}@keyframes run{0%{left:0}50%{left:calc(100% - 16px)}100%{left:0}}</style></head><body><p class="mono" style="margin:0 0 12px;font-size:13px;color:var(--trf-orange-text)">cubic-bezier(.32,.72,0,1)</p>
<div class="track"><div class="dot"></div></div>
<div style="display:flex;gap:20px;margin-top:14px" class="mono">
<span style="font-size:11px;color:var(--trf-text-muted)">instant 100</span><span style="font-size:11px;color:var(--trf-text-muted)">fast 180</span><span style="font-size:11px;color:var(--trf-text-muted)">base 260</span><span style="font-size:11px;color:var(--trf-text-muted)">slow 400</span></div>
<p style="margin:10px 0 0;font-size:12px;color:var(--trf-text-muted)">Nada se mueve más de 400ms. El movimiento confirma; si no confirma, sobra.</p></body></html>

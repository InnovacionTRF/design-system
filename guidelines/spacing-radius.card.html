<!-- @dsCard group="4 · Espacio y forma" viewport="700x210" name="Radios" subtitle="Valores de la dirección Material (la de defecto) · las otras los redefinen" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">


<link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;font-family:var(--trf-font-sans);color:var(--trf-text);background:var(--trf-surface);padding:20px}
.row{display:flex;gap:20px;align-items:flex-end}
.sw{text-align:center}
.b{width:60px;height:60px;background:var(--trf-orange-50);border:1px solid var(--trf-orange-100)}
.n{margin:8px 0 0;font-family:var(--trf-font-mono);font-size:11px;color:var(--trf-text-muted)}
.u{margin:1px 0 0;font-size:10px;color:var(--trf-text-disabled)}</style></head>
<body>
<div class="row">
<div class="sw"><div class="b" style="border-radius:var(--trf-radius-sm)"></div><p class="n">sm</p><p class="u">detalle</p></div>
<div class="sw"><div class="b" style="border-radius:var(--trf-radius-md)"></div><p class="n">md</p><p class="u">control</p></div>
<div class="sw"><div class="b" style="border-radius:var(--trf-radius-lg)"></div><p class="n">lg</p><p class="u">contenedor</p></div>
<div class="sw"><div class="b" style="border-radius:var(--trf-radius-xl)"></div><p class="n">xl</p><p class="u">hero</p></div>
<div class="sw"><div class="b" style="border-radius:var(--trf-radius-full)"></div><p class="n">full</p><p class="u">píldora</p></div>
</div>
<p style="margin:14px 0 0;font-size:12px;color:var(--trf-text-secondary)">Las formas se pintan con los tokens vivos: en Material son 8 · 8 · 12 · 16 · full; en Cálido 12 · 999 · 16 y en Nítido 6 en todo. <strong>md</strong> es el radio de control y <strong>lg</strong> el de contenedor — no los intercambie.</p>
</body></html>

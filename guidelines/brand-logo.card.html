<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">


<link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;font-family:var(--trf-font-sans);background:var(--trf-bg);padding:20px}
.tiles{display:flex;gap:16px}.tile{flex:1;border-radius:12px;padding:26px;display:grid;place-items:center;box-shadow:var(--trf-shadow-sm)}
.cap{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--trf-text-muted);margin:8px 0 0;text-align:center}</style></head>
<body>
<div class="tiles">
<div style="flex:1"><div class="tile" style="background:#fff;border:1px solid var(--trf-border)"><img src="../assets/logo.png" alt="Transfiriendo" style="height:34px"></div><p class="cap">Fondo claro</p></div>
<div style="flex:1"><div class="tile" style="background:#2f2f2f"><img src="../assets/logo-blanco.png" alt="Transfiriendo" style="height:34px"></div><p class="cap">Fondo oscuro</p></div>
<div style="flex:0 0 150px"><div class="tile" style="background:#fff;border:1px solid var(--trf-border)"><img src="../assets/isotipo.png" alt="" style="height:56px"></div><p class="cap">Isotipo ≥ 51px</p></div>
</div>
</body></html>

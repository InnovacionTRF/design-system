<script>
function demo(){
  function App(){
    const [sel,setSel]=React.useState({Salud:true,Seguros:true});
    const t=(k)=>setSel(s=>({...s,[k]:!s[k]}));
    return React.createElement('div',{style:{display:'flex',flexWrap:'wrap',gap:8}},
      ['Salud','Facturación','Seguros','Cobranzas'].map(k=>
        React.createElement(Chip,{key:k,selected:!!sel[k],onToggle:()=>t(k)},k)));
  }
  return React.createElement(App);
}
ReactDOM.createRoot(document.getElementById('root')).render(demo());</script>

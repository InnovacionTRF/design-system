<!-- @dsCard group="6 · Componentes" viewport="960x700" name="Componentes × direcciones" subtitle="Los mismos componentes en Material, Cálido y Nítido" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">



<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#e9e7e4;font-family:var(--trf-font-sans);padding:16px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .pane{background:var(--trf-bg);border-radius:10px;padding:14px;color:var(--trf-text)}
  .hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
  .hd b{font-size:13px;font-weight:600}
  .hd span{font-family:var(--trf-font-mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--trf-text-muted);white-space:nowrap}
  .stack{display:flex;flex-direction:column;gap:10px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const DS = window.TransfiriendoDesignSystem_0ece16;
const { Button, Input, Card, Badge, Alert, Tabs, Switch, Chip, Select, StatCard } = DS;

function Cluster(){
  const [tab,setTab]=React.useState("resumen");
  const [on,setOn]=React.useState(true);
  const [chip,setChip]=React.useState(true);
  return (
    <div className="stack">
      <div className="row">
        <Button size="sm">Guardar</Button>
        <Button variant="secondary" size="sm">Cancelar</Button>
        <Button variant="ghost" size="sm">Ver</Button>
      </div>
      <Input label="Nombre del proceso" placeholder="Conciliación" />
      <Select value="Salud" options={["Salud","Seguros","Cobranzas"]} />
      <div className="row">
        <Badge tone="success" dot>activo</Badge>
        <Badge tone="orange">revisión</Badge>
        <Chip selected={chip} onToggle={()=>setChip(!chip)}>Salud</Chip>
      </div>
      <Card padding={12}>
        <p style={{margin:0,fontSize:12,color:"var(--trf-text-secondary)"}}>Card: radio y sombra siguen la dirección.</p>
      </Card>
      <StatCard label="Horas ahorradas" value="1.840" delta="14,1% vs. mes anterior" trend="up" spark={[1180,1320,1290,1480,1610,1720,1840]} />
      <Tabs value={tab} onChange={setTab} items={[{id:"resumen",label:"Resumen"},{id:"detalle",label:"Detalle"}]} />
      <Alert tone="info" title="Motor DDI conectado">Actualiza cada 15 minutos.</Alert>
      <Switch checked={on} onChange={setOn} label="Notificar" />
    </div>
  );
}

const DIRS = [
  { id:"material", name:"Material", note:"12/8 · con sombra" },
  { id:"calido", name:"Cálido", note:"16/999 · sin sombra" },
  { id:"nitido", name:"Nítido", note:"6 plano · sin sombra" },
];

function App(){
  return (
    <div className="grid">
      {DIRS.map(d => (
        <div className="pane" key={d.id} data-direction={d.id}>
          <div className="hd"><b>{d.name}</b><span>{d.note}</span></div>
          <Cluster/>
        </div>
      ))}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
